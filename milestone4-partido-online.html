<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fútbol Multiplayer — Partido Online (Milestone 4)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#0b0d10; --card:#161a1f;
    --grass1:#2e8b3d; --grass2:#279235; --line:#f0f0f0;
    --p1:#3aa0ff; --p2:#ff5a3a; --ball:#ffffff;
    --text:#eee; --muted:#9aa4ad; --danger:#ff5a5a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Segoe UI', system-ui, sans-serif;
    overflow:hidden; touch-action:none; overscroll-behavior:none;
  }
  .center{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    width:100%; max-width:380px; background:var(--card);
    border-radius:16px; padding:28px 24px; text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .card h1{ font-size:20px; margin:0 0 6px 0; }
  .card .sub{ color:var(--muted); font-size:13px; margin-bottom:18px; }
  .spinner{
    width:44px; height:44px; margin:0 auto 18px auto;
    border:4px solid #2a2f36; border-top-color:var(--accent, #3aa0ff);
    border-radius:50%; animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  button{
    padding:12px 24px; border:none; border-radius:10px;
    background:#3aa0ff; color:#fff; font-size:15px; font-weight:700; cursor:pointer;
  }
  button.secondary{ background:transparent; border:1px solid #2a2f36; color:var(--muted); }
  .msg{ margin-top:14px; font-size:13px; color:var(--danger); }
  a.link{ color:#3aa0ff; text-decoration:underline; }

  .resultScore{ font-size:44px; font-weight:900; margin:10px 0; }
  .resultLabel{ font-size:22px; font-weight:800; margin-bottom:4px; }
  .resultLabel.win{ color:#3aa0ff; }
  .resultLabel.lose{ color:#ff5a5a; }
  .resultLabel.draw{ color:var(--muted); }
  .teamsLine{ color:var(--muted); font-size:13px; margin-bottom:18px; }

  /* ===== Cancha ===== */
  #matchScreen{ display:none; }
  #app{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #fieldWrap{ position:relative; line-height:0; }
  canvas{ display:block; background:#000; touch-action:none; }

  #hud{
    position:absolute; top:8px; left:0; right:0;
    display:flex; justify-content:center; align-items:center; gap:24px;
    pointer-events:none; font-variant-numeric:tabular-nums;
  }
  #score{ font-size:22px; font-weight:800; background:rgba(0,0,0,.45); padding:4px 14px; border-radius:20px; }
  #score span.p1{ color:var(--p1); }
  #score span.p2{ color:var(--p2); }
  #timer{ font-size:18px; font-weight:700; background:rgba(0,0,0,.45); padding:4px 12px; border-radius:20px; }
  #names{
    position:absolute; top:44px; left:0; right:0;
    display:flex; justify-content:center; gap:16px;
    font-size:11px; color:var(--muted); pointer-events:none;
  }

  #touchLayer{ position:absolute; inset:0; }
  #joyZone{ position:absolute; left:0; top:0; bottom:0; width:45%; }
  #joyBase, #joyStick{ position:absolute; border-radius:50%; display:none; pointer-events:none; }
  #joyBase{ width:110px; height:110px; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.35); margin-left:-55px; margin-top:-55px; }
  #joyStick{ width:50px; height:50px; background:rgba(58,160,255,.85); margin-left:-25px; margin-top:-25px; }
  #kickBtn{
    position:absolute; right:5%; bottom:12%; width:92px; height:92px; border-radius:50%;
    background:rgba(255,90,58,.35); border:3px solid rgba(255,255,255,.55);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:800; color:#fff; letter-spacing:1px;
  }
  #kickBtn.active{ background:rgba(255,90,58,.75); transform:scale(0.92); }

  #rotateHint{
    position:fixed; inset:0; background:#0b0d10; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:14px;
    z-index:20; text-align:center; padding:20px;
  }
  #rotateHint .icon{ font-size:54px; }
  @media (orientation: portrait) and (pointer: coarse){
    #rotateHint.active{ display:flex; }
    #app.hideForRotate{ display:none; }
  }
  #goalFlash{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    font-size:15vw; font-weight:900; letter-spacing:4px; color:#fff;
    text-shadow:0 0 30px rgba(255,255,255,.8); pointer-events:none; z-index:5;
  }
</style>
</head>
<body>

<div id="rotateHint"><div class="icon">📱↻</div><div>Girá el celular para jugar</div></div>

<!-- Pantalla: cargando equipo -->
<div class="center" id="loadingScreen">
  <div class="card">
    <div class="spinner"></div>
    <div class="sub">Cargando tu equipo...</div>
  </div>
</div>

<!-- Pantalla: sin equipo -->
<div class="center hidden" id="noTeamScreen" style="display:none;">
  <div class="card">
    <h1>Todavía no tenés equipo</h1>
    <div class="sub">Primero creá tu club</div>
    <a class="link" href="milestone2-cuenta-equipo.html">Ir a crear equipo</a>
  </div>
</div>

<!-- Pantalla: buscando partido -->
<div class="center" id="searchScreen" style="display:none;">
  <div class="card">
    <div class="spinner"></div>
    <h1>Buscando rival</h1>
    <div class="sub" id="searchSub">En tu división...</div>
    <button class="secondary" id="cancelSearchBtn">Cancelar</button>
    <div class="msg" id="searchMsg"></div>
  </div>
</div>

<!-- Pantalla: resultado -->
<div class="center" id="resultScreen" style="display:none;">
  <div class="card">
    <div class="resultLabel" id="resultLabel">—</div>
    <div class="teamsLine" id="resultTeams">—</div>
    <div class="resultScore" id="resultScore">0 — 0</div>
    <a class="link" href="milestone2-cuenta-equipo.html">Volver a mi equipo</a>
  </div>
</div>

<!-- Pantalla: partido -->
<div id="matchScreen">
  <div id="app">
    <div id="fieldWrap">
      <canvas id="field" width="900" height="560"></canvas>
      <div id="hud">
        <div id="score"><span class="p1">0</span> — <span class="p2">0</span></div>
        <div id="timer">3:00</div>
      </div>
      <div id="names">
        <span id="nameP1">Vos</span> vs <span id="nameP2">Rival</span>
      </div>
      <div id="touchLayer">
        <div id="joyZone"></div>
        <div id="joyBase"></div>
        <div id="joyStick"></div>
        <div id="kickBtn">PATEAR</div>
      </div>
    </div>
  </div>
</div>

<div id="goalFlash">¡GOL!</div>

<script>
(() => {
  const SUPABASE_URL = 'https://apfyquqizpjwhtbfozks.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_4ZKllj-j1j5LVRAwQL7NSQ_e9AErYWk';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const screens = {
    loading: document.getElementById('loadingScreen'),
    noTeam: document.getElementById('noTeamScreen'),
    search: document.getElementById('searchScreen'),
    result: document.getElementById('resultScreen'),
    match: document.getElementById('matchScreen'),
  };
  function showScreen(name){
    for (const k in screens) screens[k].style.display = 'none';
    screens[name].style.display = (name === 'match') ? 'block' : 'flex';
  }

  const searchMsg = document.getElementById('searchMsg');
  const cancelSearchBtn = document.getElementById('cancelSearchBtn');

  let me = null;       // { userId, teamId, teamName, divisionId }
  let queueChannel = null;

  async function init(){
    const { data: { user } } = await sb.auth.getUser();
    if (!user){
      showScreen('noTeam');
      return;
    }
    const { data: team, error } = await sb
      .from('teams')
      .select('id, name, division_id')
      .eq('owner_id', user.id)
      .maybeSingle();

    if (error || !team){
      showScreen('noTeam');
      return;
    }
    me = { userId: user.id, teamId: team.id, teamName: team.name, divisionId: team.division_id };
    startSearch();
  }

  async function startSearch(){
    showScreen('search');
    searchMsg.textContent = '';

    const { data, error } = await sb.rpc('find_or_queue_match', { p_team_id: me.teamId });
    if (error){
      searchMsg.textContent = 'Error: ' + error.message;
      return;
    }

    if (data && data.length > 0 && data[0].match_id){
      const row = data[0];
      startMatch({ matchId: row.match_id, isHost: true, opponentName: row.opponent_name });
    } else {
      subscribeToQueue();
    }
  }

  function subscribeToQueue(){
    queueChannel = sb.channel('queue-' + me.teamId)
      .on('postgres_changes', {
        event: 'UPDATE', schema: 'public', table: 'matchmaking_queue',
        filter: `team_id=eq.${me.teamId}`
      }, async (payload) => {
        const row = payload.new;
        if (row.status === 'matched' && row.match_id){
          sb.removeChannel(queueChannel);
          const { data: matchRow } = await sb.from('matches').select('away_team_id, teams:away_team_id(name)').eq('id', row.match_id).single();
          const opponentName = matchRow && matchRow.teams ? matchRow.teams.name : 'Rival';
          startMatch({ matchId: row.match_id, isHost: false, opponentName });
        }
      })
      .subscribe();
  }

  cancelSearchBtn.addEventListener('click', async () => {
    if (queueChannel) sb.removeChannel(queueChannel);
    await sb.from('matchmaking_queue').delete().eq('team_id', me.teamId);
    window.location.href = 'milestone2-cuenta-equipo.html';
  });

  // ================= PARTIDO EN VIVO =================
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function fitCanvas(){
    const aspect = W / H;
    const availW = window.innerWidth, availH = window.innerHeight;
    let cw, ch;
    if (availW / availH > aspect){ ch = availH; cw = ch * aspect; }
    else { cw = availW; ch = cw / aspect; }
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    document.getElementById('fieldWrap').style.width = cw + 'px';
    document.getElementById('fieldWrap').style.height = ch + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 200));

  const MARGIN = 30, GOAL_HEIGHT = 160, GOAL_DEPTH = 22;
  const goalTop = H/2 - GOAL_HEIGHT/2, goalBottom = H/2 + GOAL_HEIGHT/2;
  const MATCH_SECONDS = 3 * 60;

  function makePlayer(x, y, color){
    return { x, y, vx:0, vy:0, r:18, color, speed:0.55, maxSpeed:4.2, friction:0.85, kickCooldown:0 };
  }
  const p1 = makePlayer(W*0.25, H/2, getCss('--p1')); // host
  const p2 = makePlayer(W*0.75, H/2, getCss('--p2')); // guest
  const ball = { x: W/2, y: H/2, vx:0, vy:0, r:10, friction:0.985 };
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  // ---- Controles táctiles (siempre controlan a "mi" jugador) ----
  const joyZone = document.getElementById('joyZone');
  const joyBase = document.getElementById('joyBase');
  const joyStick = document.getElementById('joyStick');
  const kickBtn = document.getElementById('kickBtn');
  const input = { ax:0, ay:0, kick:false };
  let joyTouchId = null, joyOriginX = 0, joyOriginY = 0;
  const JOY_MAX = 55;

  function joyStart(id,x,y){ joyTouchId=id; joyOriginX=x; joyOriginY=y; joyBase.style.left=x+'px'; joyBase.style.top=y+'px'; joyBase.style.display='block'; joyStick.style.display='block'; joyStick.style.left=x+'px'; joyStick.style.top=y+'px'; }
  function joyMove(x,y){
    let dx=x-joyOriginX, dy=y-joyOriginY;
    const d=Math.hypot(dx,dy);
    if (d>JOY_MAX){ dx=dx/d*JOY_MAX; dy=dy/d*JOY_MAX; }
    joyStick.style.left=(joyOriginX+dx)+'px'; joyStick.style.top=(joyOriginY+dy)+'px';
    input.ax = dx/JOY_MAX; input.ay = dy/JOY_MAX;
  }
  function joyEnd(){ joyTouchId=null; joyBase.style.display='none'; joyStick.style.display='none'; input.ax=0; input.ay=0; }

  joyZone.addEventListener('touchstart', e => { for (const t of e.changedTouches){ if (joyTouchId===null) joyStart(t.identifier,t.clientX,t.clientY); } e.preventDefault(); }, {passive:false});
  joyZone.addEventListener('touchmove', e => { for (const t of e.changedTouches){ if (t.identifier===joyTouchId) joyMove(t.clientX,t.clientY); } e.preventDefault(); }, {passive:false});
  function joyTouchEndHandler(e){ for (const t of e.changedTouches){ if (t.identifier===joyTouchId) joyEnd(); } }
  joyZone.addEventListener('touchend', joyTouchEndHandler);
  joyZone.addEventListener('touchcancel', joyTouchEndHandler);
  let mouseDown = false;
  joyZone.addEventListener('mousedown', e => { mouseDown=true; joyStart('mouse', e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if (mouseDown) joyMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { if (mouseDown){ mouseDown=false; joyEnd(); } });
  kickBtn.addEventListener('touchstart', e => { input.kick=true; kickBtn.classList.add('active'); e.preventDefault(); }, {passive:false});
  kickBtn.addEventListener('touchend', e => { input.kick=false; kickBtn.classList.remove('active'); e.preventDefault(); }, {passive:false});
  kickBtn.addEventListener('mousedown', () => { input.kick=true; kickBtn.classList.add('active'); });
  window.addEventListener('mouseup', () => { input.kick=false; kickBtn.classList.remove('active'); });

  // ---- Física compartida ----
  function movePlayer(player, ax, ay){
    if (ax!==0 || ay!==0){
      const m=Math.hypot(ax,ay); if (m>1){ ax/=m; ay/=m; }
      player.vx += ax*player.speed; player.vy += ay*player.speed;
    }
    const sp=Math.hypot(player.vx,player.vy);
    if (sp>player.maxSpeed){ player.vx=player.vx/sp*player.maxSpeed; player.vy=player.vy/sp*player.maxSpeed; }
    player.vx*=player.friction; player.vy*=player.friction;
    player.x+=player.vx; player.y+=player.vy;
    player.x=clamp(player.x, MARGIN+player.r, W-MARGIN-player.r);
    player.y=clamp(player.y, MARGIN+player.r, H-MARGIN-player.r);
    if (player.kickCooldown>0) player.kickCooldown--;
  }
  function tryKick(player){
    const d=Math.hypot(ball.x-player.x, ball.y-player.y);
    const reach = player.r+ball.r+14;
    if (d<reach && player.kickCooldown===0){
      const dx=(ball.x-player.x)/(d||1), dy=(ball.y-player.y)/(d||1);
      const KICK_POWER=11.5;
      ball.vx+=dx*KICK_POWER; ball.vy+=dy*KICK_POWER;
      player.kickCooldown=18;
    }
  }
  function resolvePlayerBallCollision(player){
    const dx=ball.x-player.x, dy=ball.y-player.y;
    const dist=Math.hypot(dx,dy), minDist=player.r+ball.r;
    if (dist<minDist && dist>0){
      const nx=dx/dist, ny=dy/dist, overlap=minDist-dist;
      ball.x+=nx*overlap; ball.y+=ny*overlap;
      const push=0.6;
      ball.vx+=nx*(Math.hypot(player.vx,player.vy)*push+0.5);
      ball.vy+=ny*(Math.hypot(player.vx,player.vy)*push+0.5);
    }
  }
  function resolvePlayerPlayerCollision(a,b){
    const dx=b.x-a.x, dy=b.y-a.y;
    const dist=Math.hypot(dx,dy), minDist=a.r+b.r;
    if (dist<minDist && dist>0){
      const nx=dx/dist, ny=dy/dist, overlap=(minDist-dist)/2;
      a.x-=nx*overlap; a.y-=ny*overlap; b.x+=nx*overlap; b.y+=ny*overlap;
    }
  }
  function updateBallPhysics(onGoal){
    ball.x+=ball.vx; ball.y+=ball.vy;
    ball.vx*=ball.friction; ball.vy*=ball.friction;
    if (Math.hypot(ball.vx,ball.vy)<0.02){ ball.vx=0; ball.vy=0; }
    if (ball.y-ball.r<MARGIN){ ball.y=MARGIN+ball.r; ball.vy*=-0.7; }
    if (ball.y+ball.r>H-MARGIN){ ball.y=H-MARGIN-ball.r; ball.vy*=-0.7; }
    const inMouth = ball.y>goalTop && ball.y<goalBottom;
    if (ball.x-ball.r<MARGIN){
      if (inMouth){ if (ball.x<MARGIN-GOAL_DEPTH) onGoal(2); }
      else { ball.x=MARGIN+ball.r; ball.vx*=-0.7; }
    }
    if (ball.x+ball.r>W-MARGIN){
      if (inMouth){ if (ball.x>W-MARGIN+GOAL_DEPTH) onGoal(1); }
      else { ball.x=W-MARGIN-ball.r; ball.vx*=-0.7; }
    }
  }

  function drawField(){
    ctx.fillStyle='#0a2b0f'; ctx.fillRect(0,0,W,H);
    const stripes=10, stripeW=(W-MARGIN*2)/stripes;
    for (let i=0;i<stripes;i++){ ctx.fillStyle = i%2===0 ? getCss('--grass1') : getCss('--grass2'); ctx.fillRect(MARGIN+i*stripeW, MARGIN, stripeW+1, H-MARGIN*2); }
    ctx.strokeStyle=getCss('--line'); ctx.lineWidth=3;
    ctx.strokeRect(MARGIN,MARGIN,W-MARGIN*2,H-MARGIN*2);
    ctx.beginPath(); ctx.moveTo(W/2,MARGIN); ctx.lineTo(W/2,H-MARGIN); ctx.stroke();
    ctx.beginPath(); ctx.arc(W/2,H/2,60,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=4;
    ctx.strokeRect(MARGIN-GOAL_DEPTH, goalTop, GOAL_DEPTH, GOAL_HEIGHT);
    ctx.strokeRect(W-MARGIN, goalTop, GOAL_DEPTH, GOAL_HEIGHT);
  }
  function drawPlayer(p){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.color; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.stroke(); }
  function drawBall(b){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r||10,0,Math.PI*2); ctx.fillStyle=getCss('--ball'); ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#333'; ctx.stroke(); }

  // ---- Estado de match ----
  const scoreEl = document.querySelector('#score');
  const timerEl = document.getElementById('timer');
  const nameP1 = document.getElementById('nameP1');
  const nameP2 = document.getElementById('nameP2');
  const goalFlash = document.getElementById('goalFlash');
  const rotateHint = document.getElementById('rotateHint');
  const appEl = document.getElementById('app');

  function updateHud(score1, score2, timeLeft){
    scoreEl.innerHTML = `<span class="p1">${score1}</span> — <span class="p2">${score2}</span>`;
    const m = Math.floor(Math.max(0,timeLeft)/60);
    const s = Math.floor(Math.max(0,timeLeft)%60).toString().padStart(2,'0');
    timerEl.textContent = `${m}:${s}`;
  }

  function startMatch({ matchId, isHost, opponentName }){
    showScreen('match');
    rotateHint.classList.add('active');
    appEl.classList.add('hideForRotate');
    fitCanvas();

    if (isHost){ nameP1.textContent = me.teamName; nameP2.textContent = opponentName; }
    else { nameP1.textContent = opponentName; nameP2.textContent = me.teamName; }

    const channel = sb.channel('match-' + matchId, { config: { broadcast: { self: false } } });

    if (isHost){
      runHost(channel, matchId);
    } else {
      runGuest(channel);
    }
  }

  function runHost(channel, matchId){
    let score1 = 0, score2 = 0, timeLeft = MATCH_SECONDS, running = true, goalFreeze = 0;
    let lastTick = performance.now();
    let guestInput = { ax:0, ay:0, kick:false };

    channel.on('broadcast', { event: 'input' }, ({ payload }) => { guestInput = payload; })
      .subscribe();

    function resetPositions(){
      p1.x=W*0.25; p1.y=H/2; p1.vx=0; p1.vy=0;
      p2.x=W*0.75; p2.y=H/2; p2.vx=0; p2.vy=0;
      ball.x=W/2; ball.y=H/2; ball.vx=0; ball.vy=0;
    }
    function onGoal(forPlayer){
      if (forPlayer===1) score1++; else score2++;
      goalFlash.style.display='flex'; goalFreeze=900;
      setTimeout(()=>{ goalFlash.style.display='none'; }, 900);
      resetPositions();
    }

    async function endMatch(){
      running = false;
      // host = away_team_id en la DB (ver schema2), guest = home_team_id
      // score1 = goles del host (away), score2 = goles del guest (home)
      channel.send({ type:'broadcast', event:'matchEnd', payload:{ score1, score2 } });
      await sb.rpc('report_match_result', { p_match_id: matchId, p_home_score: score2, p_away_score: score1 });
      showResult({ myScore: score1, oppScore: score2, myName: me.teamName, oppName: nameP2.textContent });
    }

    const broadcastInterval = setInterval(() => {
      if (!running) return;
      channel.send({ type:'broadcast', event:'state', payload:{
        p1: { x:p1.x, y:p1.y }, p2: { x:p2.x, y:p2.y }, ball: { x:ball.x, y:ball.y },
        score1, score2, timeLeft
      }});
    }, 66);

    function loop(now){
      const dt = now - lastTick; lastTick = now;
      if (running){
        if (goalFreeze > 0){ goalFreeze -= dt; }
        else {
          movePlayer(p1, input.ax, input.ay);
          if (input.kick) tryKick(p1);
          movePlayer(p2, guestInput.ax || 0, guestInput.ay || 0);
          if (guestInput.kick) tryKick(p2);

          resolvePlayerPlayerCollision(p1, p2);
          resolvePlayerBallCollision(p1);
          resolvePlayerBallCollision(p2);
          updateBallPhysics(onGoal);

          timeLeft -= dt/1000;
          if (timeLeft <= 0){ timeLeft = 0; clearInterval(broadcastInterval); endMatch(); }
        }
        updateHud(score1, score2, timeLeft);
      }
      drawField(); drawPlayer(p1); drawPlayer(p2); drawBall(ball);
      if (running) requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  function runGuest(channel){
    let latest = null;
    let lastGoalFlashScore = null;

    channel.on('broadcast', { event:'state' }, ({ payload }) => {
      if (lastGoalFlashScore !== null &&
          (payload.score1 !== lastGoalFlashScore.score1 || payload.score2 !== lastGoalFlashScore.score2)){
        goalFlash.style.display='flex';
        setTimeout(()=>{ goalFlash.style.display='none'; }, 900);
      }
      lastGoalFlashScore = { score1: payload.score1, score2: payload.score2 };
      latest = payload;
      updateHud(payload.score1, payload.score2, payload.timeLeft);
    }).on('broadcast', { event:'matchEnd' }, ({ payload }) => {
      showResult({ myScore: payload.score2, oppScore: payload.score1, myName: me.teamName, oppName: nameP1.textContent });
    }).subscribe();

    setInterval(() => {
      channel.send({ type:'broadcast', event:'input', payload: { ax: input.ax, ay: input.ay, kick: input.kick } });
    }, 60);

    function loop(){
      if (latest){
        p1.x = latest.p1.x; p1.y = latest.p1.y;
        p2.x = latest.p2.x; p2.y = latest.p2.y;
        ball.x = latest.ball.x; ball.y = latest.ball.y;
      }
      drawField(); drawPlayer(p1); drawPlayer(p2); drawBall(ball);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  function showResult({ myScore, oppScore, myName, oppName }){
    showScreen('result');
    const label = document.getElementById('resultLabel');
    const teams = document.getElementById('resultTeams');
    const score = document.getElementById('resultScore');
    teams.textContent = `${myName} vs ${oppName}`;
    score.textContent = `${myScore} — ${oppScore}`;
    if (myScore > oppScore){ label.textContent = '¡Ganaste!'; label.className = 'resultLabel win'; }
    else if (myScore < oppScore){ label.textContent = 'Perdiste'; label.className = 'resultLabel lose'; }
    else { label.textContent = 'Empate'; label.className = 'resultLabel draw'; }
  }

  init();
})();
</script>
</body>
</html>
