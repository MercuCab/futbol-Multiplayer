<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fútbol Multiplayer — Prototipo Local (Milestone 0)</title>
<style>
  :root{
    --grass1:#2e8b3d;
    --grass2:#279235;
    --line:#f0f0f0;
    --p1:#3aa0ff;
    --p2:#ff5a3a;
    --ball:#ffffff;
    --bg:#111417;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    font-family:'Segoe UI', system-ui, sans-serif;
    color:#eee;
    display:flex; flex-direction:column; align-items:center;
    overflow:hidden;
  }
  h1{
    margin:14px 0 4px 0;
    font-size:20px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  #hud{
    display:flex; gap:40px; align-items:center;
    margin-bottom:8px;
    font-size:15px;
  }
  #score{
    font-size:28px; font-weight:700; font-variant-numeric:tabular-nums;
  }
  #score span.p1{color:var(--p1);}
  #score span.p2{color:var(--p2);}
  #timer{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums;}
  canvas{
    border:4px solid #08370f;
    border-radius:6px;
    box-shadow:0 8px 30px rgba(0,0,0,.6);
    touch-action:none;
  }
  #controls{
    display:flex; gap:60px;
    margin-top:10px;
    font-size:13px;
    color:#aaa;
  }
  #controls b{color:#fff;}
  #overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    gap:16px;
    z-index:10;
  }
  #overlay h2{font-size:36px; margin:0;}
  #overlay button{
    padding:12px 28px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#3aa0ff;
    color:#fff;
    cursor:pointer;
    font-weight:600;
  }
  #overlay button:hover{background:#2b8de0;}
  #goalFlash{
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    font-size:64px;
    font-weight:900;
    letter-spacing:4px;
    color:#fff;
    text-shadow:0 0 30px rgba(255,255,255,.8);
    pointer-events:none;
    z-index:5;
  }
</style>
</head>
<body>

<h1>⚽ Fútbol Multiplayer — Prototipo Local</h1>

<div id="hud">
  <div id="score"><span class="p1">0</span> — <span class="p2">0</span></div>
  <div id="timer">3:00</div>
</div>

<canvas id="field" width="900" height="560"></canvas>

<div id="controls">
  <div><b>Jugador Azul:</b> W A S D mover · F patear</div>
  <div><b>Jugador Rojo:</b> Flechas mover · Enter patear</div>
</div>

<div id="goalFlash">¡GOL!</div>

<div id="overlay">
  <h2 id="overlayTitle">Fin del partido</h2>
  <div id="overlaySubtitle" style="font-size:18px;color:#ccc;"></div>
  <button id="restartBtn">Jugar de nuevo</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // --- Config de cancha ---
  const MARGIN = 30;
  const GOAL_HEIGHT = 160;
  const GOAL_DEPTH = 22;
  const goalTop = H/2 - GOAL_HEIGHT/2;
  const goalBottom = H/2 + GOAL_HEIGHT/2;

  const MATCH_SECONDS = 3 * 60; // 3 minutos

  // --- Entidades ---
  function makePlayer(x, y, color, team){
    return {
      x, y, vx:0, vy:0, r:18, color, team,
      speed: 0.55,       // aceleración
      maxSpeed: 4.2,
      friction: 0.85,
      kicking: 0, kickCooldown: 0
    };
  }

  const p1 = makePlayer(W*0.25, H/2, getCss('--p1'), 1);
  const p2 = makePlayer(W*0.75, H/2, getCss('--p2'), 2);

  const ball = {
    x: W/2, y: H/2, vx:0, vy:0, r:10,
    friction: 0.985
  };

  function getCss(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  // --- Input ---
  const keys = new Set();
  window.addEventListener('keydown', e => {
    keys.add(e.code);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => keys.delete(e.code));

  // --- Estado del partido ---
  let score1 = 0, score2 = 0;
  let timeLeft = MATCH_SECONDS;
  let running = true;
  let lastTick = performance.now();
  let goalFreeze = 0;

  const scoreEl = document.querySelector('#score');
  const timerEl = document.getElementById('timer');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySubtitle = document.getElementById('overlaySubtitle');
  const goalFlash = document.getElementById('goalFlash');
  document.getElementById('restartBtn').addEventListener('click', resetMatch);

  function updateHud(){
    scoreEl.innerHTML = `<span class="p1">${score1}</span> — <span class="p2">${score2}</span>`;
    const m = Math.floor(Math.max(0,timeLeft) / 60);
    const s = Math.floor(Math.max(0,timeLeft) % 60).toString().padStart(2,'0');
    timerEl.textContent = `${m}:${s}`;
  }

  function resetPositions(){
    p1.x = W*0.25; p1.y = H/2; p1.vx = 0; p1.vy = 0;
    p2.x = W*0.75; p2.y = H/2; p2.vx = 0; p2.vy = 0;
    ball.x = W/2; ball.y = H/2; ball.vx = 0; ball.vy = 0;
  }

  function resetMatch(){
    score1 = 0; score2 = 0; timeLeft = MATCH_SECONDS;
    running = true;
    resetPositions();
    overlay.style.display = 'none';
    updateHud();
    lastTick = performance.now();
  }

  function goalScored(forPlayer){
    if (forPlayer === 1) score1++; else score2++;
    updateHud();
    goalFlash.style.display = 'flex';
    goalFreeze = 900; // ms de freeze/celebración
    setTimeout(() => { goalFlash.style.display = 'none'; }, 900);
    resetPositions();
  }

  function endMatch(){
    running = false;
    overlay.style.display = 'flex';
    if (score1 === score2){
      overlayTitle.textContent = 'Empate';
      overlaySubtitle.textContent = `${score1} — ${score2}`;
    } else {
      const winner = score1 > score2 ? 'Jugador Azul' : 'Jugador Rojo';
      overlayTitle.textContent = `¡Gana ${winner}!`;
      overlaySubtitle.textContent = `${score1} — ${score2}`;
    }
  }

  // --- Física ---
  function applyInput(player, up, down, left, right, kick){
    let ax = 0, ay = 0;
    if (keys.has(up)) ay -= 1;
    if (keys.has(down)) ay += 1;
    if (keys.has(left)) ax -= 1;
    if (keys.has(right)) ax += 1;
    if (ax !== 0 && ay !== 0){ ax *= 0.7071; ay *= 0.7071; }

    player.vx += ax * player.speed;
    player.vy += ay * player.speed;

    // límite de velocidad
    const sp = Math.hypot(player.vx, player.vy);
    if (sp > player.maxSpeed){
      player.vx = player.vx / sp * player.maxSpeed;
      player.vy = player.vy / sp * player.maxSpeed;
    }

    player.vx *= player.friction;
    player.vy *= player.friction;

    player.x += player.vx;
    player.y += player.vy;

    // límites de cancha
    player.x = clamp(player.x, MARGIN + player.r, W - MARGIN - player.r);
    player.y = clamp(player.y, MARGIN + player.r, H - MARGIN - player.r);

    if (player.kickCooldown > 0) player.kickCooldown--;
    if (keys.has(kick) && player.kickCooldown === 0){
      tryKick(player);
      player.kickCooldown = 18;
    }
  }

  function tryKick(player){
    const d = Math.hypot(ball.x - player.x, ball.y - player.y);
    const reach = player.r + ball.r + 14;
    if (d < reach){
      const dx = (ball.x - player.x) / (d || 1);
      const dy = (ball.y - player.y) / (d || 1);
      const KICK_POWER = 11.5;
      ball.vx += dx * KICK_POWER;
      ball.vy += dy * KICK_POWER;
    }
  }

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  function updateBall(){
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= ball.friction;
    ball.vy *= ball.friction;
    if (Math.hypot(ball.vx, ball.vy) < 0.02){ ball.vx = 0; ball.vy = 0; }

    // rebote en paredes superior/inferior
    if (ball.y - ball.r < MARGIN){
      ball.y = MARGIN + ball.r; ball.vy *= -0.7;
    }
    if (ball.y + ball.r > H - MARGIN){
      ball.y = H - MARGIN - ball.r; ball.vy *= -0.7;
    }

    // arcos: si no está en la franja del arco, la pared lateral rebota la pelota
    const inGoalMouthY = ball.y > goalTop && ball.y < goalBottom;

    if (ball.x - ball.r < MARGIN){
      if (inGoalMouthY){
        if (ball.x < MARGIN - GOAL_DEPTH){
          goalScored(2); // entró en el arco izquierdo -> gol para el equipo 2
        }
      } else {
        ball.x = MARGIN + ball.r; ball.vx *= -0.7;
      }
    }
    if (ball.x + ball.r > W - MARGIN){
      if (inGoalMouthY){
        if (ball.x > W - MARGIN + GOAL_DEPTH){
          goalScored(1); // entró en el arco derecho -> gol para el equipo 1
        }
      } else {
        ball.x = W - MARGIN - ball.r; ball.vx *= -0.7;
      }
    }
  }

  function resolvePlayerBallCollision(player){
    const dx = ball.x - player.x, dy = ball.y - player.y;
    const dist = Math.hypot(dx, dy);
    const minDist = player.r + ball.r;
    if (dist < minDist && dist > 0){
      const nx = dx / dist, ny = dy / dist;
      const overlap = minDist - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      // transferí algo del momentum del jugador a la pelota
      const push = 0.6;
      ball.vx += nx * (Math.hypot(player.vx, player.vy) * push + 0.5);
      ball.vy += ny * (Math.hypot(player.vx, player.vy) * push + 0.5);
    }
  }

  function resolvePlayerPlayerCollision(a, b){
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    const minDist = a.r + b.r;
    if (dist < minDist && dist > 0){
      const nx = dx / dist, ny = dy / dist;
      const overlap = (minDist - dist) / 2;
      a.x -= nx * overlap; a.y -= ny * overlap;
      b.x += nx * overlap; b.y += ny * overlap;
    }
  }

  // --- Render ---
  function drawField(){
    ctx.fillStyle = '#0a2b0f';
    ctx.fillRect(0,0,W,H);

    // franjas de pasto
    const stripes = 10;
    const stripeW = (W - MARGIN*2) / stripes;
    for (let i=0;i<stripes;i++){
      ctx.fillStyle = i % 2 === 0 ? getCss('--grass1') : getCss('--grass2');
      ctx.fillRect(MARGIN + i*stripeW, MARGIN, stripeW+1, H - MARGIN*2);
    }

    ctx.strokeStyle = getCss('--line');
    ctx.lineWidth = 3;
    // borde cancha
    ctx.strokeRect(MARGIN, MARGIN, W - MARGIN*2, H - MARGIN*2);
    // línea media
    ctx.beginPath();
    ctx.moveTo(W/2, MARGIN); ctx.lineTo(W/2, H-MARGIN);
    ctx.stroke();
    // círculo central
    ctx.beginPath();
    ctx.arc(W/2, H/2, 60, 0, Math.PI*2);
    ctx.stroke();

    // arcos
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.strokeRect(MARGIN - GOAL_DEPTH, goalTop, GOAL_DEPTH, GOAL_HEIGHT);
    ctx.strokeRect(W - MARGIN, goalTop, GOAL_DEPTH, GOAL_HEIGHT);
  }

  function drawPlayer(p){
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,0,0,.4)';
    ctx.stroke();
  }

  function drawBall(){
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = getCss('--ball');
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#333';
    ctx.stroke();
  }

  // --- Loop principal ---
  function loop(now){
    const dt = now - lastTick;
    lastTick = now;

    if (running){
      if (goalFreeze > 0){
        goalFreeze -= dt;
      } else {
        applyInput(p1, 'KeyW','KeyS','KeyA','KeyD','KeyF');
        applyInput(p2, 'ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter');

        resolvePlayerPlayerCollision(p1, p2);
        resolvePlayerBallCollision(p1);
        resolvePlayerBallCollision(p2);
        updateBall();

        timeLeft -= dt/1000;
        if (timeLeft <= 0){
          timeLeft = 0;
          updateHud();
          endMatch();
        } else if (Math.floor(timeLeft) !== Math.floor(timeLeft + dt/1000)) {
          updateHud();
        }
      }
    }

    drawField();
    drawPlayer(p1);
    drawPlayer(p2);
    drawBall();

    requestAnimationFrame(loop);
  }

  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
